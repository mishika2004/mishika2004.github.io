<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser Window Background -->
  <rect width="800" height="520" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Browser Header / Traffic Lights -->
  <rect width="800" height="42" rx="10" fill="#f9fafb"/>
  <rect y="32" width="800" height="10" fill="#f9fafb"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#f87171"/>
  <circle cx="40" cy="21" r="5" fill="#fbbf24"/>
  <circle cx="56" cy="21" r="5" fill="#34d399"/>
  <rect x="90" y="10" width="620" height="22" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="105" y="25" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">https://urbancart.store/products</text>

  <!-- Store Navbar -->
  <rect x="0" y="42" width="800" height="54" fill="#ffffff"/>
  <line x1="0" y1="96" x2="800" y2="96" stroke="#f3f4f6" stroke-width="1"/>
  
  <!-- Logo -->
  <circle cx="48" cy="69" r="14" fill="#22c55e" opacity="0.15"/>
  <path d="M42 69 L46 73 L54 64" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="70" y="74" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">UrbanCart</text>
  
  <!-- Search -->
  <rect x="220" y="55" width="340" height="28" rx="6" fill="#f3f4f6"/>
  <text x="238" y="73" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Search fresh vegetables, dairy, fruits...</text>
  
  <!-- Cart Pill -->
  <rect x="690" y="55" width="80" height="28" rx="14" fill="#16a34a"/>
  <text x="712" y="73" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Cart (3)</text>

  <!-- Hero Promo Banner (Light Green Theme) -->
  <g transform="translate(30, 115)">
    <rect width="740" height="185" rx="12" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
    
    <rect x="40" y="26" width="140" height="22" rx="4" fill="#dcfce7"/>
    <text x="50" y="41" fill="#16a34a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">100% ORGANIC &amp; FRESH</text>
    
    <text x="40" y="86" fill="#14532d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Fresh Groceries</text>
    <text x="40" y="118" fill="#16a34a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Delivered Fast.</text>
    <text x="40" y="148" fill="#4b5563" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Direct farm harvest at your doorstep within 30 mins.</text>
    
    <!-- Produce Basket Illustration -->
    <circle cx="620" cy="92" r="70" fill="#fef3c7" opacity="0.6"/>
    <circle cx="580" cy="110" r="32" fill="#ef4444" opacity="0.85"/>
    <circle cx="640" cy="115" r="36" fill="#f59e0b" opacity="0.9"/>
    <circle cx="610" cy="75" r="30" fill="#22c55e" opacity="0.9"/>
    <text x="580" y="116" text-anchor="middle" font-size="24">🍎</text>
    <text x="640" y="122" text-anchor="middle" font-size="28">🍊</text>
    <text x="610" y="82" text-anchor="middle" font-size="26">🥦</text>
    <text x="660" y="80" text-anchor="middle" font-size="24">🥕</text>
  </g>

  <!-- Product Row Preview -->
  <g transform="translate(30, 320)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="175" rx="8" fill="#ffffff" stroke="#f3f4f6" stroke-width="1.5"/>
      <rect x="15" y="12" width="140" height="90" rx="6" fill="#f9fafb"/>
      <text x="85" y="68" text-anchor="middle" font-size="34">🍎</text>
      <text x="16" y="122" fill="#1f2937" font-family="sans-serif" font-size="13" font-weight="700">Royal Gala Apples</text>
      <text x="16" y="140" fill="#6b7280" font-family="sans-serif" font-size="11">1 kg • $3.99</text>
      <rect x="120" y="132" width="34" height="24" rx="4" fill="#16a34a"/>
      <text x="133" y="148" fill="#ffffff" font-weight="700" font-size="13">+</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(190, 0)">
      <rect width="170" height="175" rx="8" fill="#ffffff" stroke="#f3f4f6" stroke-width="1.5"/>
      <rect x="15" y="12" width="140" height="90" rx="6" fill="#f9fafb"/>
      <text x="85" y="68" text-anchor="middle" font-size="34">🥑</text>
      <text x="16" y="122" fill="#1f2937" font-family="sans-serif" font-size="13" font-weight="700">Fresh Avocados</text>
      <text x="16" y="140" fill="#6b7280" font-family="sans-serif" font-size="11">Pack of 3 • $4.49</text>
      <rect x="120" y="132" width="34" height="24" rx="4" fill="#16a34a"/>
      <text x="133" y="148" fill="#ffffff" font-weight="700" font-size="13">+</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(380, 0)">
      <rect width="170" height="175" rx="8" fill="#ffffff" stroke="#f3f4f6" stroke-width="1.5"/>
      <rect x="15" y="12" width="140" height="90" rx="6" fill="#f9fafb"/>
      <text x="85" y="68" text-anchor="middle" font-size="34">🥕</text>
      <text x="16" y="122" fill="#1f2937" font-family="sans-serif" font-size="13" font-weight="700">Baby Carrots</text>
      <text x="16" y="140" fill="#6b7280" font-family="sans-serif" font-size="11">500g • $1.99</text>
      <rect x="120" y="132" width="34" height="24" rx="4" fill="#16a34a"/>
      <text x="133" y="148" fill="#ffffff" font-weight="700" font-size="13">+</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(570, 0)">
      <rect width="170" height="175" rx="8" fill="#ffffff" stroke="#f3f4f6" stroke-width="1.5"/>
      <rect x="15" y="12" width="140" height="90" rx="6" fill="#f9fafb"/>
      <text x="85" y="68" text-anchor="middle" font-size="34">🥦</text>
      <text x="16" y="122" fill="#1f2937" font-family="sans-serif" font-size="13" font-weight="700">Fresh Broccoli</text>
      <text x="16" y="140" fill="#6b7280" font-family="sans-serif" font-size="11">1 head • $2.49</text>
      <rect x="120" y="132" width="34" height="24" rx="4" fill="#16a34a"/>
      <text x="133" y="148" fill="#ffffff" font-weight="700" font-size="13">+</text>
    </g>
  </g>
</svg>
