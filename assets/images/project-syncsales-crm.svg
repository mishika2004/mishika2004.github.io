<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <!-- Window Container -->
  <rect width="800" height="520" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect width="800" height="42" rx="10" fill="#1e2430"/>
  <rect y="32" width="800" height="10" fill="#1e2430"/>
  <circle cx="24" cy="21" r="5" fill="#f87171"/>
  <circle cx="40" cy="21" r="5" fill="#fbbf24"/>
  <circle cx="56" cy="21" r="5" fill="#34d399"/>
  <rect x="90" y="10" width="620" height="22" rx="4" fill="#2d3748"/>
  <text x="105" y="25" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">https://syncsales.crm/analytics/pipeline</text>

  <!-- Left Sidebar (Dark Charcoal with Icons) -->
  <rect x="0" y="42" width="160" height="478" fill="#1a202c"/>
  <line x1="160" y1="42" x2="160" y2="520" stroke="#2d3748" stroke-width="1"/>
  
  <text x="24" y="76" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="800">SyncSales</text>
  
  <rect x="12" y="96" width="136" height="32" rx="6" fill="#2d3748"/>
  <text x="24" y="117" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">📊 Overview</text>
  <text x="24" y="153" fill="#a0aec0" font-family="sans-serif" font-size="11">👥 Leads</text>
  <text x="24" y="187" fill="#a0aec0" font-family="sans-serif" font-size="11">💼 Deals</text>
  <text x="24" y="221" fill="#a0aec0" font-family="sans-serif" font-size="11">📈 Analytics</text>
  <text x="24" y="255" fill="#a0aec0" font-family="sans-serif" font-size="11">⚙️ Settings</text>

  <!-- Main Content Area -->
  <rect x="160" y="42" width="640" height="478" fill="#f8fafc"/>
  
  <!-- Content Header -->
  <text x="185" y="78" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="800">Sales Dashboard</text>
  <rect x="680" y="60" width="95" height="26" rx="4" fill="#2563eb"/>
  <text x="696" y="77" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">+ Add Lead</text>

  <!-- Top Metric Cards -->
  <g transform="translate(185, 96)">
    <!-- Card 1 -->
    <rect width="180" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">TOTAL PIPELINE</text>
    <text x="16" y="48" fill="#1e293b" font-family="sans-serif" font-size="18" font-weight="800">$248,500</text>
    <text x="16" y="64" fill="#16a34a" font-family="sans-serif" font-size="10">↑ +18.4% this month</text>

    <!-- Card 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">DEALS WON</text>
      <text x="16" y="48" fill="#1e293b" font-family="sans-serif" font-size="18" font-weight="800">84 Deals</text>
      <text x="16" y="64" fill="#16a34a" font-family="sans-serif" font-size="10">↑ +24% growth</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(390, 0)">
      <rect width="205" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">CONVERSION RATE</text>
      <text x="16" y="48" fill="#1e293b" font-family="sans-serif" font-size="18" font-weight="800">32.8%</text>
      <text x="16" y="64" fill="#2563eb" font-family="sans-serif" font-size="10">Top performance band</text>
    </g>
  </g>

  <!-- Charts Section: Bar Chart (Left) & Donut Chart (Right) -->
  <g transform="translate(185, 186)">
    <!-- Bar Chart Card -->
    <rect width="365" height="305" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="28" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="700">Monthly Revenue &amp; Deal Flow</text>
    
    <!-- Grid Lines -->
    <line x1="20" y1="65" x2="345" y2="65" stroke="#f1f5f9" stroke-dasharray="3,3"/>
    <line x1="20" y1="120" x2="345" y2="120" stroke="#f1f5f9" stroke-dasharray="3,3"/>
    <line x1="20" y1="175" x2="345" y2="175" stroke="#f1f5f9" stroke-dasharray="3,3"/>
    <line x1="20" y1="230" x2="345" y2="230" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Bar Pairs (Blue & Purple) -->
    <!-- Col 1 -->
    <rect x="35" y="140" width="14" height="90" rx="3" fill="#3b82f6"/>
    <rect x="52" y="165" width="14" height="65" rx="3" fill="#8b5cf6"/>
    <text x="50" y="248" text-anchor="middle" fill="#64748b" font-size="10">Jan</text>

    <!-- Col 2 -->
    <rect x="95" y="115" width="14" height="115" rx="3" fill="#3b82f6"/>
    <rect x="112" y="135" width="14" height="95" rx="3" fill="#8b5cf6"/>
    <text x="110" y="248" text-anchor="middle" fill="#64748b" font-size="10">Feb</text>

    <!-- Col 3 -->
    <rect x="155" y="90" width="14" height="140" rx="3" fill="#3b82f6"/>
    <rect x="172" y="110" width="14" height="120" rx="3" fill="#8b5cf6"/>
    <text x="170" y="248" text-anchor="middle" fill="#64748b" font-size="10">Mar</text>

    <!-- Col 4 -->
    <rect x="215" y="75" width="14" height="155" rx="3" fill="#3b82f6"/>
    <rect x="232" y="95" width="14" height="135" rx="3" fill="#8b5cf6"/>
    <text x="230" y="248" text-anchor="middle" fill="#64748b" font-size="10">Apr</text>

    <!-- Col 5 -->
    <rect x="275" y="50" width="14" height="180" rx="3" fill="#3b82f6"/>
    <rect x="292" y="70" width="14" height="160" rx="3" fill="#8b5cf6"/>
    <text x="290" y="248" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="10">May</text>

    <!-- Donut Chart Card (Right) -->
    <g transform="translate(380, 0)">
      <rect width="215" height="305" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="18" y="28" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="700">Deals by Stage</text>

      <!-- Donut Circle Segments -->
      <circle cx="107" cy="120" r="55" fill="none" stroke="#e2e8f0" stroke-width="22"/>
      <circle cx="107" cy="120" r="55" fill="none" stroke="#3b82f6" stroke-width="22" stroke-dasharray="140 345" stroke-dashoffset="0"/>
      <circle cx="107" cy="120" r="55" fill="none" stroke="#8b5cf6" stroke-width="22" stroke-dasharray="90 345" stroke-dashoffset="-140"/>
      <circle cx="107" cy="120" r="55" fill="none" stroke="#10b981" stroke-width="22" stroke-dasharray="65 345" stroke-dashoffset="-230"/>
      <circle cx="107" cy="120" r="55" fill="none" stroke="#f59e0b" stroke-width="22" stroke-dasharray="50 345" stroke-dashoffset="-295"/>
      <text x="107" y="125" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-weight="800" font-size="16">100%</text>

      <!-- Legend -->
      <g transform="translate(20, 205)">
        <circle cx="6" cy="6" r="5" fill="#3b82f6"/>
        <text x="18" y="10" fill="#475569" font-size="10">Qualified (40%)</text>
        
        <circle cx="6" cy="24" r="5" fill="#8b5cf6"/>
        <text x="18" y="28" fill="#475569" font-size="10">Proposal (26%)</text>

        <circle cx="6" cy="42" r="5" fill="#10b981"/>
        <text x="18" y="46" fill="#475569" font-size="10">Negotiation (19%)</text>

        <circle cx="6" cy="60" r="5" fill="#f59e0b"/>
        <text x="18" y="64" fill="#475569" font-size="10">Closed Won (15%)</text>
      </g>
    </g>
  </g>
</svg>
